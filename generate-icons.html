<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator - RekenTrainer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f0f0f0; }
        h1 { color: #1e1b4b; }
        canvas { border: 1px solid #ccc; margin: 10px; background: white; }
        .info { color: #666; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>RekenTrainer Icon Generator</h1>
    <p>Klik op de knoppen om de iconen te downloaden:</p>
    
    <div>
        <canvas id="icon192" width="192" height="192"></canvas>
        <canvas id="icon512" width="512" height="512"></canvas>
    </div>
    
    <div>
        <button onclick="download(192)">Download icon-192.png</button>
        <button onclick="download(512)">Download icon-512.png</button>
    </div>
    
    <p class="info">
        Na het downloaden, plaats de bestanden in dezelfde map als index.html
    </p>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 512;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#1e1b4b');
            gradient.addColorStop(1, '#312e81');
            
            // Rounded rectangle background
            const radius = 100 * scale;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Text "1+2"
            ctx.fillStyle = 'white';
            ctx.font = `bold ${120 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('1+2', size/2, size * 0.35);
            
            // Text "=3"
            ctx.fillStyle = '#22c55e';
            ctx.font = `bold ${160 * scale}px Arial`;
            ctx.fillText('=3', size/2, size * 0.68);
            
            // Star circle
            ctx.beginPath();
            ctx.arc(size * 0.82, size * 0.18, 50 * scale, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();
            
            // Star emoji
            ctx.fillStyle = 'white';
            ctx.font = `${40 * scale}px Arial`;
            ctx.fillText('★', size * 0.82, size * 0.19);
        }
        
        function download(size) {
            const canvas = document.getElementById('icon' + size);
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Draw both icons on load
        drawIcon(document.getElementById('icon192'), 192);
        drawIcon(document.getElementById('icon512'), 512);
    </script>
</body>
</html>
